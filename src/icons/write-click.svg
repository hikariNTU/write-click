<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Glass Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Trail Gradient (W Stroke) -->
    <linearGradient id="wGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Active Right-Click Button Gradient -->
    <linearGradient id="rightClickGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter for the Gesture Trail -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Canvas Container / Background -->
  <rect width="128" height="128" rx="28" fill="#0f172a" />
  <circle cx="64" cy="64" r="56" fill="url(#bgGlow)" />

  <!-- 2. Mouse Body Base -->
  <g transform="translate(0, 0)">
    <!-- Main Mouse Silhouette -->
    <path d="M 40 32 
             C 40 20, 88 20, 88 32 
             L 88 88 
             C 88 104, 40 104, 40 88 
             Z" 
          fill="#1e293b" 
          stroke="#334155" 
          stroke-width="3" />

    <!-- Center Scroll Wheel Line & Split -->
    <path d="M 64 22 L 64 50" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 40 50 L 88 50" stroke="#334155" stroke-width="2.5" />

    <!-- Highlighting the Active Right-Click Trigger Area -->
    <path d="M 64 22 
             L 76 22 
             C 84 22, 88 26, 88 34 
             L 88 50 
             L 64 50 
             Z" 
          fill="url(#rightClickGlow)" />
  </g>

  <!-- 3. Glowing Gesture Trail forming the "W" -->
  <!-- Overlaid across the right-click section down into the mouse body -->
  <g filter="url(#neonGlow)">
    <!-- Vector "W" stroke with cardinal corner caps -->
    <path d="M 38 42 
             L 50 82 
             L 64 58 
             L 78 82 
             L 90 42" 
          fill="none" 
          stroke="url(#wGlow)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Leading Edge Cursor Point / Glowing Node -->
    <circle cx="90" cy="42" r="4.5" fill="#e0e7ff" />
  </g>
</svg>
