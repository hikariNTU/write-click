<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!--
    The 16px and 32px variant. At toolbar size the full mark turns to mud: the
    mouse body, the button split and the W all land on the same value, and the
    neon blur smears what is left. Everything except the identity is dropped —
    no mouse silhouette, no glow filter, no cursor node — and the W is scaled up
    and thickened until it survives a 16px box.
  -->
  <defs>
    <linearGradient id="wGlowSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0f172a" />

  <path d="M 24 40 L 46 92 L 64 62 L 82 92 L 104 40"
        fill="none"
        stroke="url(#wGlowSmall)"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>
