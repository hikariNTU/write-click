<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Write Click — Settings</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <main class="mx-auto w-full max-w-3xl px-6 py-12">
      <header class="mb-10 flex items-end justify-between gap-4">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">Write Click</h1>
          <p class="mt-1 text-sm text-slate-400">Mouse gestures for tabs and pages.</p>
        </div>
        <p id="saved" class="text-xs font-medium text-emerald-300 opacity-0 transition-opacity">
          Saved
        </p>
      </header>

      <section id="trigger" class="mb-6"></section>
      <section id="gestures" class="mb-6"></section>
      <section id="overlay" class="mb-6"></section>
      <section id="sites" class="mb-6"></section>

      <footer class="flex items-center justify-between gap-4 pt-2">
        <p class="text-xs text-slate-500">Changes save as you make them.</p>
        <button
          id="reset"
          type="button"
          class="rounded-lg border border-white/10 px-3 py-2 text-xs font-medium text-slate-300 transition-colors hover:border-rose-400/40 hover:text-rose-300"
        >
          Reset everything to defaults
        </button>
      </footer>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
