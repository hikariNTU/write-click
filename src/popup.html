<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Write Click</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body class="w-72 bg-mist-950 p-4 text-mist-100 antialiased">
    <header class="mb-3 flex items-center gap-2.5">
      <span id="brand" class="block h-7 w-7 shrink-0 [&>svg]:h-full [&>svg]:w-full"></span>
      <div class="min-w-0 flex-1">
        <h1 class="text-sm font-semibold leading-tight tracking-tight">Write Click</h1>
        <span id="trigger" class="font-mono text-[10px] text-mist-500"></span>
      </div>
    </header>
    <div id="controls" class="flex flex-col"></div>
    <button
      id="options"
      type="button"
      class="mt-3 inline-flex w-full items-center justify-center gap-1.5 rounded-lg border border-white/10 px-3 py-2 text-xs font-medium text-mist-300 transition-colors hover:border-emerald-300/40 hover:text-emerald-200"
    >
      <span
        id="options-icon"
        class="h-3.5 w-3.5 inline-grid shrink-0 place-items-center [&>svg]:h-full [&>svg]:w-full"
      ></span>
      <span data-i18n="popup_settings">Settings</span>
      <span
        id="options-open"
        class="h-3 w-3 inline-grid shrink-0 place-items-center [&>svg]:h-full [&>svg]:w-full"
      ></span>
    </button>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
