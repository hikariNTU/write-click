<!doctype html>
<!--
  The capture is named, not linked: `shots/out/` holds one folder per locale
  and the interface inside the frame is in that locale's own words, so the
  renderer resolves `data-shot` against the listing it is building.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="slide.css" />
  </head>
  <body>
    <header>
      <h1></h1>
      <p></p>
    </header>
    <div class="stage">
      <figure><img data-shot="1-gesture" alt="" /></figure>
    </div>
  </body>
</html>
